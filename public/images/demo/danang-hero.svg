<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="seaGradHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="dragonHero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="mountainHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="400" fill="url(#heroSky)"/>

  <!-- Sun -->
  <circle cx="850" cy="190" r="75" fill="#FEF08A" opacity="0.95"/>
  <circle cx="850" cy="190" r="110" fill="#FEF08A" opacity="0.35"/>

  <!-- Distant Mountains (Son Tra) -->
  <path d="M0,280 Q250,140 500,260 Q750,150 1000,270 L1200,290 L1200,400 L0,400 Z" fill="url(#mountainHero)" opacity="0.8"/>

  <!-- Distant City Skyline -->
  <rect x="580" y="220" width="35" height="70" fill="#0F172A" opacity="0.6"/>
  <rect x="625" y="200" width="28" height="90" fill="#0F172A" opacity="0.7"/>
  <rect x="660" y="235" width="40" height="55" fill="#0F172A" opacity="0.6"/>
  <rect x="710" y="210" width="30" height="80" fill="#0F172A" opacity="0.7"/>

  <!-- Sea Layer -->
  <path d="M0,270 Q300,255 600,270 T1200,265 L1200,400 L0,400 Z" fill="url(#seaGradHero)"/>

  <!-- Dragon Bridge Landmark Arch -->
  <path d="M120,320 Q320,180 540,320 T960,320" fill="none" stroke="url(#dragonHero)" stroke-width="16" stroke-linecap="round"/>
  <!-- Roadway -->
  <line x1="80" y1="320" x2="1020" y2="320" stroke="#CBD5E1" stroke-width="6"/>

  <!-- Ocean Waves -->
  <path d="M0,320 Q200,310 400,320 T800,318 T1200,322" stroke="#BAE6FD" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M0,355 Q300,345 600,355 T1200,350" stroke="#E0F2FE" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Golden Beach Coastline in Foreground -->
  <path d="M0,360 Q400,340 800,370 L1200,375 L1200,400 L0,400 Z" fill="#F59E0B" opacity="0.9"/>
  <!-- Coconut Palms -->
  <path d="M90,400 Q110,320 160,250 M160,250 Q200,240 230,265 M160,250 Q180,215 210,225 M160,250 Q130,205 110,220" stroke="#064E3B" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M1100,400 Q1080,310 1020,240 M1020,240 Q980,230 950,255 M1020,240 Q1000,205 970,215 M1020,240 Q1050,195 1070,210" stroke="#064E3B" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
