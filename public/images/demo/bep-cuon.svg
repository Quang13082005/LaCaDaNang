<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#woodGrad)"/>
  <!-- Bamboo Mat Plate -->
  <ellipse cx="300" cy="220" rx="220" ry="140" fill="url(#plateGrad)" stroke="#B45309" stroke-width="4"/>
  <!-- Fresh Banana Leaf -->
  <ellipse cx="300" cy="220" rx="190" ry="120" fill="#15803D"/>
  <path d="M120,220 Q300,210 480,220" stroke="#166534" stroke-width="2"/>
  <!-- Rolls -->
  <g transform="translate(180, 160)">
    <rect width="80" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="25" cy="18" r="6" fill="#F97316"/>
    <rect x="38" y="10" width="4" height="16" fill="#16A34A"/>
    <rect x="46" y="10" width="4" height="16" fill="#EA580C"/>
  </g>
  <g transform="translate(260, 200)">
    <rect width="80" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="25" cy="18" r="6" fill="#F97316"/>
    <rect x="38" y="10" width="4" height="16" fill="#16A34A"/>
    <rect x="46" y="10" width="4" height="16" fill="#EA580C"/>
  </g>
  <g transform="translate(340, 170)">
    <rect width="80" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="25" cy="18" r="6" fill="#F97316"/>
    <rect x="38" y="10" width="4" height="16" fill="#16A34A"/>
  </g>
  <!-- Dipping Sauce Bowl -->
  <circle cx="300" cy="270" r="32" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="300" cy="270" r="26" fill="#9A3412"/>
  <circle cx="295" cy="265" r="3" fill="#DC2626"/>
  <circle cx="305" cy="272" r="2.5" fill="#FEF08A"/>
  <!-- Tag badge text -->
  <rect x="24" y="24" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.6)" backdrop-filter="blur(4px)"/>
  <text x="89" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🥢 Bếp Cuốn</text>
</svg>
