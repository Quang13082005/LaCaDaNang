<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#hotelSky)"/>
  <!-- Sea Horizon -->
  <rect y="220" width="600" height="180" fill="#0369A1"/>
  <!-- Infinity Pool on rooftop / foreground -->
  <rect y="290" width="600" height="110" fill="#06B6D4"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
  <!-- Modern Hotel Tower Silhouette -->
  <rect x="360" y="60" width="160" height="230" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
  <rect x="380" y="80" width="120" height="190" fill="url(#glassGrad)" opacity="0.7"/>
  <!-- Glass Window Panes -->
  <line x1="380" y1="120" x2="500" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="160" x2="500" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="200" x2="500" y2="200" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="240" x2="500" y2="240" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="440" y1="80" x2="440" y2="270" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Pool loungers -->
  <rect x="60" y="320" width="60" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="140" y="320" width="60" height="18" rx="4" fill="#FFFFFF"/>
  <!-- Tag badge text -->
  <rect x="24" y="24" width="140" height="32" rx="16" fill="rgba(15, 23, 42, 0.6)" backdrop-filter="blur(4px)"/>
  <text x="94" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏨 Sala Beach Hotel</text>
</svg>
