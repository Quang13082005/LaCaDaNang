<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="coffeeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#84CC16"/>
      <stop offset="65%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cafeBg)"/>
  <!-- Ambient Warm Light -->
  <circle cx="300" cy="180" r="160" fill="#F59E0B" opacity="0.15"/>
  <!-- Botanical Plant Silhouette in Background -->
  <path d="M120,400 Q140,240 80,180 Q140,240 180,220 Q140,240 160,150" stroke="#065F46" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M480,400 Q460,250 520,190 Q460,250 420,230" stroke="#065F46" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Wooden Table -->
  <rect y="280" width="600" height="120" fill="#78350F"/>
  <!-- Avocado Coffee Glass -->
  <path d="M260,160 L340,160 L330,300 L270,300 Z" fill="url(#coffeeGlass)" stroke="#F8FAFC" stroke-width="3" opacity="0.9"/>
  <!-- Straw -->
  <line x1="320" y1="110" x2="290" y2="290" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <!-- Glass Rim Highlight -->
  <ellipse cx="300" cy="160" rx="40" ry="10" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
  <!-- Coaster -->
  <ellipse cx="300" cy="305" rx="45" ry="12" fill="#451A03"/>
  <!-- Tag badge text -->
  <rect x="24" y="24" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.6)" backdrop-filter="blur(4px)"/>
  <text x="89" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☕ Cà Phê Trình</text>
</svg>
