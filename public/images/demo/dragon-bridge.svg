<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#nightGrad)"/>
  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="200" cy="40" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="340" cy="70" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="500" cy="30" r="2" fill="#FFFFFF" opacity="0.9"/>
  <!-- Skyline -->
  <rect x="40" y="160" width="45" height="100" fill="#1E293B" opacity="0.8"/>
  <rect x="95" y="140" width="35" height="120" fill="#334155" opacity="0.8"/>
  <rect x="140" y="180" width="50" height="80" fill="#1E293B" opacity="0.7"/>
  <rect x="420" y="150" width="55" height="110" fill="#334155" opacity="0.8"/>
  <rect x="485" y="130" width="40" height="130" fill="#1E293B" opacity="0.8"/>
  <!-- Windows -->
  <circle cx="110" cy="160" r="2" fill="#FEF08A"/>
  <circle cx="110" cy="180" r="2" fill="#FEF08A"/>
  <circle cx="440" cy="170" r="2" fill="#FEF08A"/>
  <circle cx="505" cy="150" r="2" fill="#FEF08A"/>
  <!-- Han River -->
  <rect y="260" width="600" height="140" fill="url(#riverGrad)"/>
  <!-- Dragon Bridge Arch -->
  <path d="M0,260 Q150,150 300,260 T600,260" fill="none" stroke="url(#dragonGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Dragon Head Shape -->
  <path d="M500,250 C540,210 570,220 590,200 C560,240 530,255 500,260 Z" fill="#F97316"/>
  <!-- Fire Glow -->
  <circle cx="590" cy="200" r="24" fill="#EF4444" opacity="0.6"/>
  <circle cx="590" cy="200" r="14" fill="#FBBF24" opacity="0.8"/>
  <!-- Bridge Roadway -->
  <line x1="0" y1="260" x2="600" y2="260" stroke="#94A3B8" stroke-width="6"/>
  <!-- Water Reflection -->
  <path d="M120,290 Q200,292 280,290" stroke="#F59E0B" stroke-width="3" opacity="0.5"/>
  <path d="M220,320 Q300,322 380,320" stroke="#F97316" stroke-width="3" opacity="0.4"/>
  <path d="M480,300 Q540,302 590,300" stroke="#EF4444" stroke-width="4" opacity="0.6"/>
  <!-- Tag badge text -->
  <rect x="24" y="24" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.6)" backdrop-filter="blur(4px)"/>
  <text x="89" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌉 Cầu Rồng</text>
</svg>
